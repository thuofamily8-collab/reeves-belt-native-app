name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ------------------------------------------------------------
      # 3. Java JDK
      # ------------------------------------------------------------
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ------------------------------------------------------------
      # 4. Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # ------------------------------------------------------------
      # 5. Install npm dependencies
      # ------------------------------------------------------------
      - name: Install npm dependencies
        run: npm install

      # ------------------------------------------------------------
      # 6. Add Android platform
      # ------------------------------------------------------------
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ------------------------------------------------------------
      # 7. Generate Android icons + splash screens from resources/
      #    This is what creates the gold shield icon in all sizes.
      # ------------------------------------------------------------
      - name: Generate Android assets
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#0a0e1a' \
            --splashBackgroundColor '#0a0e1a'
        continue-on-error: true

      # ------------------------------------------------------------
      # 8. Patch target SDK for Android 14+ compatibility
      # ------------------------------------------------------------
      - name: Patch target SDK for Android 14 compatibility
        run: |
          cat > android/variables.gradle << 'EOF'
          ext {
              minSdkVersion = 26
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.0'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.9.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF
          echo "--- variables.gradle after patch ---"
          cat android/variables.gradle

      # ------------------------------------------------------------
      # 9. Patch AndroidManifest permissions
      # ------------------------------------------------------------
      - name: Patch AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i '/<application/i \
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.FLASHLIGHT" />\
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\
              <uses-feature android:name="android.hardware.camera" android:required="true" />\
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' "$MANIFEST"
          fi
          echo "--- Manifest after patch ---"
          cat "$MANIFEST"

      # ------------------------------------------------------------
      # 10. Capacitor sync
      # ------------------------------------------------------------
      - name: Capacitor sync
        run: npx cap sync android

      # ------------------------------------------------------------
      # 11. Make gradlew executable
      # ------------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ------------------------------------------------------------
      # 12. Build Debug APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # ------------------------------------------------------------
      # 13. Prepare artifact
      # ------------------------------------------------------------
      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/reeves-belt-app-debug-${TIMESTAMP}.apk
          ls -la artifacts/

      # ------------------------------------------------------------
      # 14. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reeves-belt-app-debug-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------
      # 15. Attach APK to GitHub Release (on tags)
      # ------------------------------------------------------------
      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
