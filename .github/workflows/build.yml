name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Check out the code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Node.js setup (Capacitor CLI needs Node)
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ------------------------------------------------------------
      # 3. Java JDK for Gradle
      # ------------------------------------------------------------
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ------------------------------------------------------------
      # 4. Android SDK
      #    FIX: explicitly pass packages to avoid deprecated 'tools'
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # ------------------------------------------------------------
      # 5. Install npm dependencies
      # ------------------------------------------------------------
      - name: Install npm dependencies
        run: npm install

      # ------------------------------------------------------------
      # 6. Add Android platform (if not already present)
      # ------------------------------------------------------------
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ------------------------------------------------------------
      # 7. Sync web assets into native project
      # ------------------------------------------------------------
      - name: Capacitor sync
        run: npx cap sync android

      # ------------------------------------------------------------
      # 8. Make Gradle wrapper executable
      # ------------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ------------------------------------------------------------
      # 9. Build debug APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # ------------------------------------------------------------
      # 10. Rename APK with a friendly, timestamped name
      # ------------------------------------------------------------
      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/reeves-belt-secure360-debug-${TIMESTAMP}.apk
          ls -la artifacts/

      # ------------------------------------------------------------
      # 11. Upload APK as a downloadable artifact
      # ------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reeves-belt-secure360-debug-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------
      # 12. Optional: attach to GitHub Release when a tag is pushed
      # ------------------------------------------------------------
      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
