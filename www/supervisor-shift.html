<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <title>On Shift - Reeves Belt App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: #0a0e1a;
            color: #fff;
            font-family: -apple-system, "Segoe UI", Arial, sans-serif;
            overflow: hidden;
        }
        .shift-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 30px 20px 20px;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .shift-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.15), transparent 60%);
            pointer-events: none;
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .shift-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }
        .shift-status {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
            color: #10b981;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }
        .shift-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }
        .shift-tenant {
            font-size: 14px;
            color: #d4af37;
            font-weight: 600;
        }
        .shift-timer {
            font-size: 56px;
            font-weight: 700;
            font-family: "Courier New", monospace;
            color: #d4af37;
            letter-spacing: 3px;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            position: relative;
            z-index: 2;
        }
        .shift-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            position: relative;
            z-index: 2;
        }
        .shift-info-card {
            background: #14192e;
            border-radius: 12px;
            padding: 14px;
            border-left: 3px solid #d4af37;
        }
        .shift-info-label {
            font-size: 10px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .shift-info-value {
            font-size: 15px;
            color: #fff;
            margin-top: 4px;
            font-weight: 600;
        }
        .shift-info-value.green { color: #10b981; }
        .shift-info-value.red { color: #ef4444; }
        .shift-info-value.yellow { color: #f59e0b; }

        .shift-footer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 3;
        }
        .shift-footer button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            box-shadow: 0 6px 0 #991b1b;
        }
        .shift-footer .hint {
            text-align: center;
            color: #8892b0;
            font-size: 11px;
            margin-top: 12px;
        }

        .pin-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .pin-modal.show { display: flex; }
        .pin-box {
            background: #14192e;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            border: 2px solid #d4af37;
        }
        .pin-box h3 {
            color: #d4af37;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
        }
        .pin-box input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: #0a0e1a;
            color: #fff;
            border: 2px solid #d4af37;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
            font-family: monospace;
        }
        .pin-box input:focus { outline: none; border-color: #f0d060; }
        .pin-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .pin-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }
        .pin-confirm { background: #10b981; color: #fff; }
        .pin-cancel { background: #333; color: #fff; }
        .pin-error { color: #ef4444; font-size: 12px; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

<div class="shift-screen">

    <div class="shift-header">
        <div class="shift-status">● ON DUTY</div>
        <div class="shift-title">Supervisor Shift</div>
        <div class="shift-tenant" id="shiftTenant">Loading...</div>
    </div>

    <div class="shift-timer" id="shiftTimer">00:00:00</div>

    <div class="shift-info-grid">
        <div class="shift-info-card">
            <div class="shift-info-label">GPS</div>
            <div class="shift-info-value green" id="gpsStatus">● Active</div>
        </div>
        <div class="shift-info-card">
            <div class="shift-info-label">Last Ping</div>
            <div class="shift-info-value" id="lastPing">—</div>
        </div>
        <div class="shift-info-card">
            <div class="shift-info-label">Battery</div>
            <div class="shift-info-value" id="batteryLevel">—</div>
        </div>
        <div class="shift-info-card">
            <div class="shift-info-label">Pings Sent</div>
            <div class="shift-info-value" id="pingCount">0</div>
        </div>
    </div>

    <div class="shift-footer">
        <button onclick="RBSupervisor.requestEndShift()">🛑 END SHIFT</button>
        <div class="hint">Long-press top-left corner with PIN to exit</div>
    </div>

</div>

<div class="pin-modal" id="pinModal">
    <div class="pin-box">
        <h3>Enter PIN to End Shift</h3>
        <input type="tel" id="pinInput" maxlength="6" placeholder="••••" inputmode="numeric">
        <div class="pin-error" id="pinError" style="display:none;"></div>
        <div class="pin-actions">
            <button class="pin-cancel" onclick="RBSupervisor.cancelEndShift()">Cancel</button>
            <button class="pin-confirm" onclick="RBSupervisor.confirmEndShift()">Confirm</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/offline.js"></script>
<script src="js/permissions.js"></script>
<script src="js/app.js"></script>
<script src="js/supervisor.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    try {
        RBSupervisor.initShiftScreen();
    } catch (e) {
        console.error('initShiftScreen failed:', e);
    }
});
</script>

</body>
</html>
