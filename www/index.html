<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Reeves Belt Guard</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="splash-page">
    <div class="splash-container">
        <div class="splash-logo-wrap">
            <img src="assets/logo.png" alt="Reeves Belt" class="splash-logo" onerror="this.style.display='none'">
        </div>
        <div class="splash-brand">REEVES BELT</div>
        <div class="splash-brand-sub">SECURE 360</div>
        <div class="splash-tagline">Guard Mobile App</div>
        <div class="splash-loader"></div>
        <div class="splash-status" id="splashStatus">Starting up...</div>
    </div>

    <script src="js/vault.js"></script>
    <script src="js/biometric.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var status = document.getElementById('splashStatus');

            function go(to) {
                status.textContent = 'Loading...';
                setTimeout(function() { window.location.href = to; }, 200);
            }

            setTimeout(function() {
                status.textContent = 'Checking login...';
                try {
                    var loggedIn = (typeof RBAuth !== 'undefined') && RBAuth.isLoggedIn();
                    if (loggedIn) {
                        status.textContent = 'Welcome back!';
                        go('dashboard.html');
                    } else {
                        go('login.html');
                    }
                } catch (e) {
                    console.error('[splash] isLoggedIn error:', e);
                    go('login.html');
                }
            }, 1000);
        });
    </script>
</body>
</html>
