<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Login - Reeves Belt App</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">

    <div class="network-bar" id="networkBar"></div>

    <div class="login-container">
        <img src="assets/logo.png" alt="Reeves Belt" class="login-logo" onerror="this.style.display='none'">

        <div class="login-brand">
            <div class="login-brand-main">REEVES BELT</div>
            <div class="login-brand-sub">SECURE 360</div>
        </div>

        <h2 class="login-title">Sign In</h2>

        <div id="loginError" class="error-box" style="display:none;"></div>

        <form id="loginForm" autocomplete="off">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                <span id="loginBtnText">LOGIN</span>
            </button>
        </form>

        <div class="login-footer">
            © 2026 REEVES BELT SECURITY CO.<br>
            <strong>Powered by Lexans Services</strong>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/offline.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // Init network bar on login screen too
            if (typeof RBOffline !== 'undefined') {
                RBOffline.init();
            }

            // If already logged in, go to landing page
            if (RBAuth.isLoggedIn()) {
                window.location.href = RBAuth.getDefaultLandingPage();
                return;
            }

            var form     = document.getElementById('loginForm');
            var btn      = document.getElementById('loginBtn');
            var btnText  = document.getElementById('loginBtnText');
            var errorBox = document.getElementById('loginError');

            function showError(msg) {
                errorBox.textContent = '❌ ' + msg;
                errorBox.style.display = 'block';
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            }

            function clearError() {
                errorBox.style.display = 'none';
                errorBox.textContent = '';
            }

            function resetButton() {
                btn.disabled = false;
                btnText.textContent = 'LOGIN';
            }

            function goToLanding() {
                window.location.href = RBAuth.getDefaultLandingPage();
            }

            // ---- Offline login path ----
            function tryOfflineLogin(username, password) {
                if (!RBAuth.hasCachedCredentials()) {
                    showError('You are offline and no cached credentials are available. Connect to the internet and log in once.');
                    resetButton();
                    return;
                }

                RBAuth.loginOffline(username, password).then(function (result) {
                    if (result.ok) {
                        if (navigator.vibrate) navigator.vibrate(100);
                        btnText.textContent = 'OFFLINE MODE';
                        setTimeout(goToLanding, 500);
                    } else {
                        showError(result.message || 'Offline login failed.');
                        resetButton();
                    }
                }).catch(function () {
                    showError('Offline login failed.');
                    resetButton();
                });
            }

            // ---- Online login path ----
            function doOnlineLogin(username, password, deviceInfo) {
                RBApi.login(username, password, deviceInfo)
                    .then(function (response) {
                        RBAuth.saveSession(response);

                        // Cache credentials for future offline use
                        RBAuth.cacheCredentials(username, password).then(function () {
                            if (navigator.vibrate) navigator.vibrate(100);
                            btnText.textContent = 'SUCCESS!';
                            setTimeout(goToLanding, 400);
                        });
                    })
                    .catch(function (err) {
                        // Network failure → fall back to offline
                        var isNetErr = !err
                                    || err.code === 'network_error'
                                    || err.code === 'timeout'
                                    || err.code === 'no_response'
                                    || err.httpStatus === 0
                                    || (err.error && /cannot reach|network|timed out/i.test(err.error));

                        if (isNetErr) {
                            console.log('[login] Network error — trying offline login');
                            tryOfflineLogin(username, password);
                        } else {
                            showError((err && err.error) || 'Login failed. Check your credentials.');
                            resetButton();
                        }
                    });
            }

            // ---- Submit handler ----
            form.addEventListener('submit', function (e) {
                e.preventDefault();

                var username = document.getElementById('username').value.trim();
                var password = document.getElementById('password').value;

                if (!username || !password) {
                    showError('Please enter username and password');
                    return;
                }

                clearError();
                btn.disabled = true;
                btnText.innerHTML = '<span class="spinner"></span>SIGNING IN...';

                var deviceInfo = {
                    device_id: 'android-' + Date.now(),
                    device_name: 'Android Device',
                    device_platform: 'android'
                };

                // If already known to be offline, skip network entirely
                if (navigator.onLine === false) {
                    tryOfflineLogin(username, password);
                    return;
                }

                if (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Device) {
                    Capacitor.Plugins.Device.getInfo().then(function (info) {
                        deviceInfo.device_name = (info.manufacturer || '') + ' ' + (info.model || 'Device');
                        deviceInfo.device_platform = info.platform || 'android';
                    }).catch(function () {}).then(function () {
                        doOnlineLogin(username, password, deviceInfo);
                    });
                } else {
                    doOnlineLogin(username, password, deviceInfo);
                }
            });
        });
    </script>
</body>
</html>
