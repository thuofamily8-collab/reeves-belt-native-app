<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Login - Reeves Belt App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
            overflow: hidden;
            padding: 20px;
        }

        /* =========================
           MAIN PANEL
           ========================= */
        .login-box {
            width: 95%;
            max-width: 560px;
            padding: 70px 50px;
            background: linear-gradient(145deg, #1f1f33, #141424);
            border-radius: 22px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            color: #fff;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        .login-box:before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 198, 255, 0.08), transparent 60%);
            animation: glowMove 8s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes glowMove {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-box * {
            position: relative;
            z-index: 2;
        }

        /* =========================
           BRAND
           ========================= */
        .logo {
            text-align: center;
            font-size: 44px;
            font-weight: 900;
            color: #00c6ff;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 24px rgba(0, 198, 255, 0.35);
        }

        .subtitle {
            text-align: center;
            font-size: 16px;
            color: #aaa;
            margin-bottom: 4px;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .tagline {
            text-align: center;
            font-size: 12px;
            color: #00c6ff;
            margin-bottom: 30px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.85;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 30px;
            font-weight: 800;
        }

        /* =========================
           INPUTS
           ========================= */
        .input-group {
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #0e0e18;
            color: #fff;
            font-size: 16px;
            outline: none;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #666;
        }

        input:focus {
            box-shadow: 0 0 14px #00c6ff;
        }

        /* =========================
           3D BUTTON
           ========================= */
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(145deg, #00c6ff, #0072ff);
            box-shadow: 0 7px 0 #005bb5, 0 14px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
        }

        button:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #005bb5;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* =========================
           ERROR BOX
           ========================= */
        .error {
            color: #ff4d4d;
            text-align: center;
            margin-bottom: 16px;
            font-size: 14px;
            padding: 10px 14px;
            background: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.35);
            border-radius: 10px;
            display: none;
        }

        .error.show { display: block; }

        /* =========================
           FOOTER
           ========================= */
        .dev {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: #888;
            line-height: 1.6;
        }

        .dev .copyright {
            color: #00c6ff;
            font-weight: 700;
            font-size: 13px;
        }

        .dev .powered {
            color: #ff1e1e;
            font-weight: 700;
            margin-top: 4px;
            font-size: 13px;
        }

        /* =========================
           SPINNER
           ========================= */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* =========================
           MOBILE
           ========================= */
        @media (max-width: 480px) {
            .login-box {
                padding: 40px 25px;
            }
            .logo { font-size: 32px; }
            .subtitle { font-size: 13px; letter-spacing: 2px; }
            .tagline { font-size: 10px; letter-spacing: 3px; margin-bottom: 22px; }
            h2 { font-size: 24px; }
            button { font-size: 16px; padding: 14px; }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">REEVES BELT</div>
        <div class="subtitle">SECURE 360</div>
        <div class="tagline">Guard Mobile App</div>

        <h2>Sign In</h2>

        <div id="loginError" class="error"></div>

        <form id="loginForm" autocomplete="off">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn">
                <span id="loginBtnText">LOGIN</span>
            </button>
        </form>

        <div class="dev">
            <div class="copyright">© 2026 Reeves Belt Security Co.</div>
            <div class="powered">Powered by Nepheleon Systems - Nairobi, Kenya</div>
        </div>

    </div>

    <script src="js/vault.js"></script>
    <script src="js/biometric.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/offline.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // Network bar
            if (typeof RBOffline !== 'undefined') {
                RBOffline.init();
            }

            // Already logged in? Skip to landing page.
            if (typeof RBAuth !== 'undefined' && RBAuth.isLoggedIn()) {
                window.location.href = RBAuth.getDefaultLandingPage();
                return;
            }

            var form     = document.getElementById('loginForm');
            var btn      = document.getElementById('loginBtn');
            var btnText  = document.getElementById('loginBtnText');
            var errorBox = document.getElementById('loginError');

            function showError(msg) {
                errorBox.textContent = '❌ ' + msg;
                errorBox.classList.add('show');
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            }

            function clearError() {
                errorBox.classList.remove('show');
                errorBox.textContent = '';
            }

            function resetButton() {
                btn.disabled = false;
                btnText.textContent = 'LOGIN';
            }

            function goToLanding() {
                window.location.href = RBAuth.getDefaultLandingPage();
            }

            // ---- Offline login path ----
            function tryOfflineLogin(username, password) {
                if (typeof RBAuth.hasCachedCredentials !== 'function' || !RBAuth.hasCachedCredentials()) {
                    showError('You are offline and no cached credentials are available. Connect to the internet and log in once.');
                    resetButton();
                    return;
                }

                RBAuth.loginOffline(username, password).then(function (result) {
                    if (result.ok) {
                        if (navigator.vibrate) navigator.vibrate(100);
                        btnText.textContent = 'OFFLINE MODE';
                        setTimeout(goToLanding, 500);
                    } else {
                        showError(result.message || 'Offline login failed.');
                        resetButton();
                    }
                }).catch(function () {
                    showError('Offline login failed.');
                    resetButton();
                });
            }

            // ---- Online login path ----
            function doOnlineLogin(username, password, deviceInfo) {
                RBAuth.login(username, password, deviceInfo)
                    .then(function () {
                        if (typeof RBAuth.cacheCredentials === 'function') {
                            RBAuth.cacheCredentials(username, password).then(function () {
                                if (navigator.vibrate) navigator.vibrate(100);
                                btnText.textContent = 'SUCCESS!';
                                setTimeout(goToLanding, 400);
                            }).catch(function () {
                                if (navigator.vibrate) navigator.vibrate(100);
                                btnText.textContent = 'SUCCESS!';
                                setTimeout(goToLanding, 400);
                            });
                        } else {
                            if (navigator.vibrate) navigator.vibrate(100);
                            btnText.textContent = 'SUCCESS!';
                            setTimeout(goToLanding, 400);
                        }
                    })
                    .catch(function (err) {
                        var isNetErr = !err
                                    || err.code === 'network_error'
                                    || err.code === 'timeout'
                                    || err.code === 'no_response'
                                    || err.httpStatus === 0
                                    || (err.error && /cannot reach|network|timed out/i.test(err.error));

                        if (isNetErr && typeof RBAuth.hasCachedCredentials === 'function') {
                            console.log('[login] Network error — trying offline login');
                            tryOfflineLogin(username, password);
                        } else {
                            showError((err && err.error) || 'Login failed. Check your credentials.');
                            resetButton();
                        }
                    });
            }

            // ---- Submit ----
            form.addEventListener('submit', function (e) {
                e.preventDefault();

                var username = document.getElementById('username').value.trim();
                var password = document.getElementById('password').value;

                if (!username || !password) {
                    showError('Please enter username and password');
                    return;
                }

                clearError();
                btn.disabled = true;
                btnText.innerHTML = '<span class="spinner"></span>SIGNING IN...';

                var deviceInfo = {
                    device_id: 'android-' + Date.now(),
                    device_name: 'Android Device',
                    device_platform: 'android'
                };

                if (navigator.onLine === false) {
                    tryOfflineLogin(username, password);
                    return;
                }

                if (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Device) {
                    Capacitor.Plugins.Device.getInfo().then(function (info) {
                        deviceInfo.device_name = (info.manufacturer || '') + ' ' + (info.model || 'Device');
                        deviceInfo.device_platform = info.platform || 'android';
                    }).catch(function () {}).then(function () {
                        doOnlineLogin(username, password, deviceInfo);
                    });
                } else {
                    doOnlineLogin(username, password, deviceInfo);
                }
            });
        });
    </script>
</body>
</html>
