<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Reveal Code - Reeves Belt App</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">

    <div class="network-bar" id="networkBar"></div>

    <div class="form-container">

        <div class="form-header">
            <button class="back-btn" onclick="window.location.href='preweighed-list.html'">←</button>
            <div class="form-header-title">🔍 Reveal Code</div>
        </div>

        <div class="info-banner">
            Enter the code from the sample label to reveal the truck details so it can be called to the weighbridge.
        </div>

        <div class="form-card">
            <div class="field">
                <label class="field-label">Sample Code</label>
                <input type="text" id="pwRevealInput" class="field-input" placeholder="e.g. C23M" maxlength="4" style="text-align:center; font-size:28px; font-family:'Courier New',monospace; letter-spacing:8px; text-transform:uppercase;" autocomplete="off">
            </div>
            <button type="button" onclick="RBPreweighed.revealCode()" class="action-btn blue" style="width:100%; margin-top:14px;">🔓 Reveal</button>
        </div>

        <div id="pwRevealResult" style="display:none;"></div>

    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Looking up...</div>
    </div>

    <script src="js/vault.js"></script>
    <script src="js/biometric.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/app.js"></script>
    <script src="js/preweighed.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            RBPreweighed.initRevealPage();
        });
    </script>
</body>
</html>
