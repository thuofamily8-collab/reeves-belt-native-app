<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <title>Vehicle Entry - Reeves Belt App</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">

<div class="network-bar" id="networkBar"></div>

<div class="form-container">

    <div class="form-header">
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="form-header-title">🚛 Vehicle Entry</div>
    </div>

    <!-- PREFILL BADGE -->
    <div id="prefillBadge" style="display:none; margin: 0 15px 15px; padding: 14px 16px; background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(5,150,105,0.15)); border: 2px solid #10b981; border-radius: 12px;">
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="font-size:24px;">📥</div>
            <div style="flex:1;">
                <div style="font-size:11px; color:#10b981; letter-spacing:2px; font-weight:800; text-transform:uppercase; margin-bottom:4px;">Pre-filled from Pre-Weighed Truck</div>
                <div style="font-size:12px; color:#a7f3d0;">Code: <span id="prefillCode" style="font-family:'Courier New',monospace; font-weight:800; font-size:14px;">—</span></div>
                <div style="font-size:11px; color:#6b7280; margin-top:4px;">Add photos and confirm details to complete entry</div>
            </div>
        </div>
    </div>

    <!-- CAMERA CARD -->
    <div class="form-card">
        <div class="form-card-title">Vehicle Photo</div>
        <div class="camera-preview">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <img id="cameraImage" style="display:none;" alt="">
            <div id="cameraPlaceholder" class="camera-placeholder">
                <span class="icon">📷</span>
                <div>Camera preview</div>
            </div>
            <div id="timestampOverlay" class="camera-timestamp" style="display:none;">
                <div class="time" id="timeDisplay">--:--:--</div>
                <div>VEHICLE ENTRY</div>
            </div>
        </div>
        <div class="camera-btns">
            <button type="button" class="cam-btn start" id="startCamBtn" onclick="startCamera()">📷 Start Camera</button>
            <button type="button" class="cam-btn capture" id="captureBtn" onclick="capturePhoto()" disabled>📸 Capture</button>
        </div>
    </div>

    <!-- VEHICLE DETAILS -->
    <div class="form-card">
        <div class="form-card-title">Vehicle Details</div>

        <div class="field">
            <label class="field-label">Plate Number *</label>
            <input type="text" id="plateNumber" class="field-input" placeholder="e.g. KDV 123Y" style="text-transform:uppercase;">
        </div>

        <div class="field-row">
            <div class="field">
                <label class="field-label">Type *</label>
                <select id="vehicleType" class="field-input">
                    <option value="">-- Select --</option>
                    <option value="Truck">Truck</option>
                    <option value="Trailer">Trailer</option>
                    <option value="Pickup">Pickup</option>
                    <option value="Van">Van</option>
                    <option value="Car">Car</option>
                    <option value="Motorcycle">Motorcycle</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="field">
                <label class="field-label">Model</label>
                <input type="text" id="vehicleModel" class="field-input" placeholder="e.g. Isuzu FRR">
            </div>
        </div>

        <div class="field">
            <label class="field-label">Color</label>
            <input type="text" id="vehicleColor" class="field-input" placeholder="e.g. White">
        </div>
    </div>

    <!-- DRIVER DETAILS -->
    <div class="form-card">
        <div class="form-card-title">Driver Details</div>

        <div class="field">
            <label class="field-label">Driver Name *</label>
            <input type="text" id="driverName" class="field-input" placeholder="Full name">
        </div>

        <div class="field-row">
            <div class="field">
                <label class="field-label">ID Number *</label>
                <input type="text" id="driverId" class="field-input" placeholder="ID">
            </div>
            <div class="field">
                <label class="field-label">Phone *</label>
                <input type="tel" id="driverPhone" class="field-input" placeholder="07XX XXX XXX">
            </div>
        </div>
    </div>

    <!-- ENTRY DETAILS -->
    <div class="form-card">
        <div class="form-card-title">Entry Details</div>

        <div class="field">
            <label class="field-label">Purpose *</label>
            <select id="purpose" class="field-input">
                <option value="">-- Select --</option>
                <option value="Delivery">Delivery</option>
                <option value="Pickup">Pickup</option>
                <option value="Service">Service</option>
                <option value="Staff">Staff</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="field">
            <label class="field-label">Net Weight (kg) - Empty Truck *</label>
            <input type="number" id="entryWeight" class="field-input" placeholder="Read from weighbridge" inputmode="numeric">
            <div style="font-size:11px; color:#8892b0; margin-top:5px;">
                ⚖️ Enter the truck's empty weight as shown on the weighbridge
            </div>
        </div>

        <div class="field">
            <label class="field-label">Comment</label>
            <textarea id="entryComment" class="field-input" rows="3" placeholder="Optional remarks"></textarea>
        </div>
    </div>

</div>

<div class="form-actions">
    <button class="action-btn green" onclick="submitEntry()">✅ Record Entry</button>
    <button class="action-btn red" onclick="voidEntry()">✕ Cancel</button>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Loading...</div>
</div>

<!-- CORE SCRIPTS -->
<script src="js/vault.js"></script>
<script src="js/biometric.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/offline.js"></script>
<script src="js/app.js"></script>
<script src="js/permissions.js"></script>
<script src="js/shift-common.js"></script>

<!-- PRINTER STACK (must come before vehicle.js) -->
<script src="js/escpos.js"></script>
<script src="js/printers.js"></script>
<script src="js/label-templates.js"></script>
<script src="js/gate-passes.js"></script>

<!-- PAGE CONTROLLER -->
<script src="js/vehicle.js"></script>

</body>
</html>
