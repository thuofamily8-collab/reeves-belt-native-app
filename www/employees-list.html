<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Employees - Reeves Belt App</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">

<div class="network-bar" id="networkBar"></div>

<div class="form-container">

    <div class="form-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="form-header-title">👥 Employee Registry</div>
    </div>

    <div style="margin: 0 0 14px;">
        <a href="employee-add.html" class="action-btn green" style="display:block; text-align:center; text-decoration:none; padding:16px; border-radius:14px;">➕ Add Employee</a>
    </div>

    <div class="form-card">
        <div class="form-card-title">Filters</div>
        <div class="field">
            <label class="field-label">Search (name / code / ID / phone)</label>
            <input type="text" id="empSearch" class="field-input" placeholder="Type to search...">
        </div>
        <div class="field-row">
            <div class="field">
                <label class="field-label">Status</label>
                <select id="empStatus" class="field-input">
                    <option value="active" selected>Active</option>
                    <option value="inactive">Inactive</option>
                    <option value="suspended">Suspended</option>
                    <option value="all">All</option>
                </select>
            </div>
            <div class="field">
                <label class="field-label">Department</label>
                <input type="text" id="empDept" class="field-input" placeholder="e.g. Production">
            </div>
        </div>
        <button type="button" onclick="RBAlcohol.loadEmployeesPage(0)" class="action-btn blue" style="width:100%; margin-top:10px;">Apply Filters</button>
    </div>

    <div id="empPagination"></div>

    <div class="app-section-title" style="padding-left:5px; margin-bottom:12px;">Employees</div>
    <div id="empList">
        <div class="empty-state"><p>Loading...</p></div>
    </div>

</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Loading...</div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/offline.js"></script>
<script src="js/app.js"></script>
<script src="js/alcohol.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        RBAlcohol.initEmployeesList();
    });
</script>

</body>
</html>
