<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Vehicle Exit - Reeves Belt App</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">

<div class="network-bar" id="networkBar"></div>

<div class="form-container">

    <div class="form-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="form-header-title">🚪 Vehicle Exit</div>
    </div>

    <div class="app-section-title" style="padding-left:5px; margin-bottom:12px;">Vehicles Currently Inside</div>

    <div id="vehiclesList">
        <div class="empty-state"><p>Loading...</p></div>
    </div>

</div>

<div id="exitModal" class="modal-overlay">
    <div class="modal-content">

        <div class="modal-header">
            <div class="modal-title">🚪 Process Vehicle Exit</div>
            <button class="modal-close" onclick="closeExitModal()">✕</button>
        </div>

        <div class="modal-body">

            <div style="background:#0e0e18; border-radius:12px; padding:16px; margin-bottom:16px;">
                <div style="font-size:22px; font-weight:900; color:#00c6ff; font-family:'Courier New',monospace; letter-spacing:2px; margin-bottom:8px;" id="modalPlate">—</div>
                <div style="font-size:13px; color:#ccd6f6; margin-bottom:4px;" id="modalDriver">👤 —</div>
                <div style="font-size:13px; color:#8892b0;" id="modalPurpose">📋 —</div>
            </div>

            <div class="field">
                <label class="field-label">Entry Weight</label>
                <input type="text" id="modalEntryWeight" class="field-input" readonly style="background:rgba(0,198,255,0.08); border-color:rgba(0,198,255,0.3); color:#00c6ff; font-weight:700;">
            </div>

            <div class="field">
                <label class="field-label">Exit Weight (kg) *</label>
                <input type="number" id="modalExitWeight" class="field-input" placeholder="e.g. 29500" inputmode="numeric" autocomplete="off">
            </div>

            <div id="weightComparison" class="weight-comparison">
                <div class="comparison-placeholder">Enter exit weight to compare</div>
            </div>

            <div class="field">
                <label class="field-label">Exit Comment</label>
                <textarea id="modalExitComment" class="field-input" rows="2" placeholder="Optional remarks"></textarea>
            </div>

            <div class="field">
                <label class="field-label">Notes (required to flag)</label>
                <textarea id="modalNotes" class="field-input" rows="2" placeholder="Add notes before flagging"></textarea>
            </div>

        </div>

        <div class="modal-footer">
            <button class="action-btn green" onclick="submitExit(false)">✓ Authorize Exit</button>
            <button class="action-btn red" onclick="submitExit(true)">⚠️ Flag Vehicle</button>
        </div>

    </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Processing...</div>
</div>

<script src="js/vault.js"></script>
<script src="js/biometric.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/offline.js"></script>
<script src="js/app.js"></script>
<script src="js/permissions.js"></script>
<script src="js/shift-common.js"></script>
<script src="js/vehicle-exit.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (typeof RBShift !== 'undefined') {
            RBShift.injectBanner();
        }
    });
</script>

</body>
</html>
