<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Guard Clock-In - Reeves Belt</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/forms.css">
    <style>
        .sh-header-site {
            font-size: 12px;
            color: rgba(255,255,255,0.85);
            font-weight: 600;
            margin-top: 2px;
        }
        .sh-tabs {
            display: flex; gap: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px; padding: 5px;
            margin-bottom: 16px;
        }
        .sh-tab {
            flex: 1; padding: 11px;
            border: none; border-radius: 8px;
            background: transparent; color: #8892b0;
            font-size: 12px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.5px;
            cursor: pointer; transition: all 0.2s;
            font-family: inherit;
        }
        .sh-tab.active {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            box-shadow: 0 4px 12px rgba(0,198,255,0.4);
        }

        .sh-device-banner {
            margin: 0 0 14px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(5,150,105,0.15));
            border: 2px solid #10b981;
            border-radius: 12px;
        }
        .sh-device-banner.no-holder {
            background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(217,119,6,0.15));
            border-color: #f59e0b;
        }
        .sh-device-label {
            font-size: 10px; color: #8892b0;
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 4px;
        }
        .sh-device-name {
            font-size: 15px; font-weight: 800; color: #10b981;
        }

        .sh-guard-card {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; margin-bottom: 8px;
            background: linear-gradient(145deg, #1f1f33, #141424);
            border-radius: 12px;
            border-left: 4px solid #10b981;
            transition: all 0.15s;
        }
        .sh-guard-card.off { border-left-color: #6b7280; opacity: 0.85; }
        .sh-guard-card:active { transform: scale(0.99); background: rgba(0,198,255,0.05); }

        .sh-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(145deg, #00c6ff, #0072ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; font-weight: 800; color: #fff; flex-shrink: 0;
        }
        .sh-guard-card.off .sh-avatar {
            background: linear-gradient(145deg,#3a3a4e,#232336);
        }

        .sh-guard-info { flex: 1; min-width: 0; }
        .sh-guard-name {
            font-size: 14px; font-weight: 800; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .sh-guard-meta {
            font-size: 11px; color: #8892b0; margin-top: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .sh-post-badge {
            display: inline-block; padding: 2px 8px;
            background: rgba(0,198,255,0.2); border: 1px solid #00c6ff;
            border-radius: 10px; font-size: 9px; font-weight: 800;
            color: #00c6ff; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .sh-status-badge {
            display: inline-block; padding: 2px 8px;
            border-radius: 10px; font-size: 9px; font-weight: 800;
            letter-spacing: 0.5px; text-transform: uppercase;
        }
        .sh-status-badge.live {
            background: rgba(16,185,129,0.2); color: #10b981;
            border: 1px solid #10b981;
        }
        .sh-status-badge.pending {
            background: rgba(107,114,128,0.2); color: #8892b0;
            border: 1px solid #4b5563;
        }

        .sh-btn {
            padding: 8px 12px; border: none; border-radius: 8px;
            font-size: 11px; font-weight: 800; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px;
            flex-shrink: 0; font-family: inherit;
        }
        .sh-btn-start {
            background: linear-gradient(145deg, #00c6ff, #0072ff);
            color: #fff; box-shadow: 0 3px 0 #005bb5;
        }
        .sh-btn-end {
            background: rgba(239,68,68,0.15); color: #ef4444;
            border: 1px solid #ef4444;
        }
        .sh-btn:active { transform: translateY(2px); box-shadow: none; }

        .sh-section-label {
            font-size: 11px; color: #8892b0;
            text-transform: uppercase; letter-spacing: 1.5px;
            font-weight: 800; margin: 18px 5px 10px;
        }
        .sh-empty {
            text-align: center; color: #6b7280;
            font-size: 13px; padding: 20px;
        }

        .sh-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        .sh-modal.show { display: flex; }
        .sh-modal-box {
            background: #14192e; border-radius: 16px;
            padding: 24px; max-width: 400px; width: 100%;
            border: 2px solid #d4af37;
        }
        .sh-modal-box h3 {
            color: #d4af37; font-size: 16px; font-weight: 800;
            text-align: center; margin-bottom: 14px; letter-spacing: 1px;
        }
        .sh-modal-target {
            text-align: center; color: #ccd6f6;
            font-size: 14px; margin-bottom: 14px;
        }
        .sh-modal-input {
            width: 100%; padding: 16px; border-radius: 12px;
            background: #0a0e1a; color: #fff; border: 2px solid #d4af37;
            font-size: 22px; text-align: center; letter-spacing: 8px;
            font-family: 'Courier New', monospace; font-weight: 700;
            outline: none; box-sizing: border-box;
        }
        .sh-modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .sh-modal-actions button {
            flex: 1; padding: 14px; border-radius: 10px; border: none;
            font-size: 13px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; font-family: inherit;
        }
        .sh-modal-confirm { background: #10b981; color: #fff; }
        .sh-modal-cancel  { background: #333; color: #fff; }
        .sh-modal-error {
            color: #ef4444; font-size: 12px;
            text-align: center; margin-top: 8px; display: none;
        }

        .sh-setpin-prompt {
            background: rgba(245,158,11,0.1);
            border: 1px solid #f59e0b;
            border-radius: 10px;
            padding: 12px 14px;
            margin: 8px 0 16px;
            font-size: 12px;
            color: #fde68a;
            line-height: 1.5;
        }
    </style>
</head>
<body class="form-page">

    <div class="network-bar" id="networkBar"></div>

    <div class="form-container">

        <div class="form-header">
            <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
            <div style="flex:1;">
                <div class="form-header-title" id="shHeaderTitle">Guard Clock-In</div>
                <div class="sh-header-site" id="shHeaderSite">Loading...</div>
            </div>
            <button class="back-btn" onclick="RBShiftHandover.showSupervisorMenu()" title="Menu">☰</button>
        </div>

        <div class="sh-tabs">
            <button class="sh-tab active" id="tabClockin"  onclick="RBShiftHandover.switchTab('clockin')">Clock-In</button>
            <button class="sh-tab"        id="tabOnduty"   onclick="RBShiftHandover.switchTab('onduty')">On Duty</button>
            <button class="sh-tab"        id="tabDevice"   onclick="RBShiftHandover.switchTab('device')">Device</button>
        </div>

        <div id="shBanner" class="sh-device-banner no-holder">
            <div class="sh-device-label">📱 Device Held By</div>
            <div class="sh-device-name" id="shBannerName">Loading...</div>
        </div>

        <div id="shContent">
            <div class="sh-empty">Loading roster...</div>
        </div>

    </div>

    <!-- PIN MODAL -->
    <div id="shPinModal" class="sh-modal">
        <div class="sh-modal-box">
            <h3 id="shPinTitle">Enter PIN</h3>
            <div id="shPinTarget" class="sh-modal-target"></div>
            <input type="tel" id="shPinInput" class="sh-modal-input" maxlength="6" placeholder="••••" inputmode="numeric" autocomplete="off">
            <div id="shPinError" class="sh-modal-error"></div>
            <div class="sh-modal-actions">
                <button class="sh-modal-cancel" onclick="RBShiftHandover.closePinModal()">Cancel</button>
                <button class="sh-modal-confirm" onclick="RBShiftHandover.confirmPin()">✓ Confirm</button>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Loading...</div>
    </div>

    <script src="js/vault.js"></script>
    <script src="js/biometric.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/app.js"></script>
    <script src="js/shift-handover.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            RBShiftHandover.init();
        });
    </script>
</body>
</html>
