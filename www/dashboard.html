<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Dashboard - Reeves Belt Guard</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="dashboard-page">

    <div class="network-bar" id="networkBar"></div>

    <div class="app-container">

        <div class="app-header">
            <div class="app-header-avatar" id="userAvatar">G</div>
            <div class="app-header-info">
                <div class="app-header-name" id="userName">Guard</div>
                <div class="app-header-role" id="userRole">Security Guard</div>
                <div class="app-header-tenant" id="userTenant">🏢 Loading...</div>
            </div>
            <button class="app-header-logout" onclick="RBAuth.logout()" title="Logout">🚪</button>
        </div>

        <div class="app-section-title">Today's Status</div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="statVehicles">0</div>
                <div class="stat-label">Inside</div>
            </div>
            <div class="stat-box green">
                <div class="stat-value" id="statVisitors">0</div>
                <div class="stat-label">Visitors</div>
            </div>
            <div class="stat-box purple">
                <div class="stat-value" id="statDetections">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>

        <div class="app-section-title">Quick Actions</div>
        <div class="action-grid">

            <a href="vehicle-entry.html" class="action-tile entry">
                <div class="action-icon">🚛</div>
                <div class="action-title">Vehicle Entry</div>
                <div class="action-sub">Log incoming</div>
            </a>

            <a href="vehicle-exit.html" class="action-tile exit">
                <div class="action-icon">🚪</div>
                <div class="action-title">Vehicle Exit</div>
                <div class="action-sub">Process exit</div>
            </a>

            <a href="visitor-checkin.html" class="action-tile visitor">
                <div class="action-icon">👥</div>
                <div class="action-title">Visitors</div>
                <div class="action-sub">Check-in / out</div>
            </a>

            <a href="patrol-scan.html" class="action-tile patrol">
                <div class="action-icon">📍</div>
                <div class="action-title">Patrol Scan</div>
                <div class="action-sub">QR checkpoint</div>
            </a>

        </div>

        <div class="app-section-title">Pending Alerts</div>
        <div class="notification-list" id="notificationsList">
            <div class="notification-empty">Loading...</div>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!RBAuth.requireLogin()) return;

            var user = RBAuth.getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = user.full_name || 'Guard';
                document.getElementById('userRole').textContent = user.role_display || 'Security Guard';
                document.getElementById('userAvatar').textContent = (user.full_name || 'G').charAt(0).toUpperCase();
            }
            document.getElementById('userTenant').textContent = '🏢 ' + RBAuth.getTenantName();

            RBApp.loadDashboardStats();
            RBApp.loadPendingDetections();

            setInterval(function() {
                if (!document.hidden) {
                    RBApp.loadDashboardStats();
                    RBApp.loadPendingDetections();
                }
            }, 30000);

            RBApp.startNetworkMonitor();
        });
    </script>
</body>
</html>
