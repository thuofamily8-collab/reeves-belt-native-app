<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Add Parked Truck - Reeves Belt App</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">

    <div class="network-bar" id="networkBar"></div>

    <div class="form-container">

        <div class="form-header">
            <button class="back-btn" onclick="window.location.href='preweighed-list.html'">←</button>
            <div class="form-header-title">➕ Add Parked Truck</div>
        </div>

        <div class="info-banner">
            <strong>Note:</strong> Each truck gets a unique code that hides its identity from lab testers.
        </div>

        <div class="form-card">
            <div class="form-card-title">Vehicle Details</div>

            <div class="field">
                <label class="field-label">Vehicle Plate *</label>
                <input type="text" id="pwPlate" class="field-input" placeholder="e.g. KDV 123Y" style="text-transform:uppercase;" required>
            </div>

            <div class="field-row">
                <div class="field">
                    <label class="field-label">Product</label>
                    <select id="pwProduct" class="field-input">
                        <option value="">-- Select --</option>
                        <option value="Maize">Maize</option>
                        <option value="Wheat">Wheat</option>
                        <option value="Barley">Barley</option>
                        <option value="Sorghum">Sorghum</option>
                        <option value="Soya">Soya</option>
                        <option value="Rice">Rice</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label">Declared Weight (kg)</label>
                    <input type="number" id="pwWeight" class="field-input" placeholder="e.g. 28000" inputmode="numeric">
                </div>
            </div>
        </div>

        <div class="form-card">
            <div class="form-card-title">Driver & Transporter</div>

            <div class="field">
                <label class="field-label">Driver Name</label>
                <input type="text" id="pwDriverName" class="field-input" placeholder="Full name">
            </div>

            <div class="field">
                <label class="field-label">Driver Phone</label>
                <input type="tel" id="pwDriverPhone" class="field-input" placeholder="07XX XXX XXX" inputmode="tel">
            </div>

            <div class="field">
                <label class="field-label">Transporter Company</label>
                <input type="text" id="pwCompany" class="field-input" placeholder="e.g. Maize Movers Ltd">
            </div>
        </div>

        <div class="form-card">
            <div class="form-card-title">Notes</div>
            <div class="field">
                <textarea id="pwNotes" class="field-input" placeholder="Any observations (optional)" rows="3"></textarea>
            </div>
        </div>

    </div>

    <div class="form-actions">
        <button class="action-btn blue" onclick="RBPreweighed.submitAdd()">💾 Save Truck</button>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Saving...</div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/app.js"></script>
    <script src="js/preweighed.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            RBPreweighed.initAddPage();
        });
    </script>
</body>
</html>
