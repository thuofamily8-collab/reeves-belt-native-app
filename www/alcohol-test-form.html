<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>AlcoBlow Test - Reeves Belt App</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">

<div class="network-bar" id="networkBar"></div>

<div class="form-container">

    <div class="form-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="form-header-title">🍷 AlcoBlow Test</div>
    </div>

    <div class="info-banner">
        <strong>Note:</strong> Point the AlcoBlow device at the employee, then record the reading below.
    </div>

    <div id="alThresholdHint" style="margin: 0 0 14px; padding: 8px 12px; background: rgba(212,175,55,0.1); border-left: 3px solid #d4af37; border-radius: 6px; font-size: 11px; color: #f0d060; letter-spacing: 0.5px; font-family: 'Courier New', monospace;">
        Pass ≤ 0.000 · Warn 0.050–0.080 · Fail ≥ 0.080 mg/100mL
    </div>

    <div class="form-card">
        <div class="form-card-title">Employee</div>
        <div class="field">
            <label class="field-label">Select Employee *</label>
            <select id="alEmployee" class="field-input">
                <option value="">Loading...</option>
            </select>
        </div>
    </div>

    <div class="form-card">
        <div class="form-card-title">Reading</div>
        <div class="field">
            <label class="field-label">Reading (mg/100mL) *</label>
            <input type="number" id="alReading" class="field-input" placeholder="e.g. 0.000" step="0.001" min="0" inputmode="decimal" style="font-size: 24px; text-align: center; font-family: 'Courier New', monospace; font-weight: 900; letter-spacing: 2px;">
        </div>
        <div id="alPreview" style="display:none;"></div>
    </div>

    <div class="form-card">
        <div class="form-card-title">Witness</div>
        <div class="field">
            <label class="field-label">Witness Name *</label>
            <input type="text" id="alWitness" class="field-input" placeholder="Witness full name">
        </div>
        <div class="field">
            <label class="field-label">Witness ID Number</label>
            <input type="text" id="alWitnessId" class="field-input" placeholder="ID number">
        </div>
    </div>

    <div class="form-card">
        <div class="form-card-title">Additional Info</div>
        <div class="field">
            <label class="field-label">Vehicle Plate (if applicable)</label>
            <input type="text" id="alVehiclePlate" class="field-input" placeholder="e.g. KDV 123Y" style="text-transform: uppercase;">
        </div>
        <div class="field">
            <label class="field-label">Notes</label>
            <textarea id="alNotes" class="field-input" rows="2" placeholder="Optional remarks"></textarea>
        </div>
    </div>

</div>

<div class="form-actions">
    <button class="action-btn green" onclick="RBAlcohol.submitTest()">✓ Record Test</button>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Loading...</div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/offline.js"></script>
<script src="js/app.js"></script>
<script src="js/alcohol.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        RBAlcohol.initTestForm();
    });
</script>

</body>
</html>
