<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Truck Details - Reeves Belt App</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">

    <div class="network-bar" id="networkBar"></div>

    <div class="form-container">

        <div class="form-header">
            <button class="back-btn" onclick="window.location.href='preweighed-list.html'">←</button>
            <div class="form-header-title">🚛 Truck Details</div>
        </div>

        <div class="form-card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
                <div>
                    <div style="font-size:11px; color:#8892b0; letter-spacing:1px; margin-bottom:4px;">VEHICLE PLATE</div>
                    <div id="pwDetailPlate" style="font-size:26px; font-weight:900; color:#00c6ff; font-family:'Courier New',monospace; letter-spacing:2px;">—</div>
                </div>
                <div id="pwDetailStatus" style="background:#3b82f6; color:#fff; font-size:11px; font-weight:800; letter-spacing:1px; padding:6px 12px; border-radius:8px; text-transform:uppercase;">—</div>
            </div>

            <div style="display:flex; align-items:center; gap:10px; padding:14px 16px; background:rgba(212,175,55,0.15); border:1px solid rgba(212,175,55,0.3); border-radius:10px;">
                <span style="font-size:11px; color:#d4af37; font-weight:700; letter-spacing:2px;">CODE</span>
                <span id="pwDetailCode" style="font-family:'Courier New',monospace; font-size:30px; font-weight:900; color:#f0d060; letter-spacing:6px;">—</span>
            </div>
        </div>

        <div class="form-card">
            <div class="form-card-title">Driver & Transporter</div>
            <div class="field">
                <label class="field-label">Driver</label>
                <div id="pwDetailDriver" style="color:#fff; font-size:15px; padding:8px 0;">—</div>
            </div>
            <div class="field">
                <label class="field-label">Phone</label>
                <div id="pwDetailPhone" style="color:#fff; font-size:15px; padding:8px 0;">—</div>
            </div>
            <div class="field">
                <label class="field-label">Company</label>
                <div id="pwDetailCompany" style="color:#fff; font-size:15px; padding:8px 0;">—</div>
            </div>
        </div>

        <div class="form-card">
            <div class="form-card-title">Product</div>
            <div class="field">
                <label class="field-label">Type</label>
                <div id="pwDetailProduct" style="color:#fff; font-size:15px; padding:8px 0;">—</div>
            </div>
            <div class="field">
                <label class="field-label">Declared Weight</label>
                <div id="pwDetailWeight" style="color:#fff; font-size:15px; padding:8px 0;">—</div>
            </div>
            <div class="field">
                <label class="field-label">Arrived</label>
                <div id="pwDetailArrival" style="color:#fff; font-size:15px; padding:8px 0;">—</div>
            </div>
        </div>

        <div class="form-card">
            <div class="form-card-title">Notes</div>
            <div id="pwDetailNotes" style="color:#ccd6f6; font-size:13px; line-height:1.6; padding:4px 0;">—</div>
        </div>

        <div class="form-card">
            <button id="pwSampleBtn" class="action-btn green" style="width:100%;" onclick="RBPreweighed.goToSample()">🧪 Take Sample</button>
        </div>

    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Loading...</div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/app.js"></script>
    <script src="js/preweighed.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            RBPreweighed.initDetailPage();
        });
    </script>
</body>
</html>
