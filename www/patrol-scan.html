<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Patrol Scan — Reeves Belt App</title>

<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/forms.css">

<style>
.patrol-header {
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 100%);
    color: #d4af37;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 2px solid #d4af37;
}
.patrol-header h1 {
    font-size: 18px;
    margin: 0;
    flex: 1;
    font-weight: 600;
}
.patrol-back {
    background: none;
    border: none;
    color: #d4af37;
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
}

.progress-card {
    background: #14192e;
    border-radius: 12px;
    margin: 16px;
    padding: 16px;
    color: #fff;
}
.progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}
.progress-percent {
    font-size: 28px;
    font-weight: 700;
    color: #d4af37;
}
.progress-bar {
    height: 8px;
    background: #2a3155;
    border-radius: 4px;
    overflow: hidden;
    margin: 10px 0;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #d4af37 0%, #f0d060 100%);
    transition: width 0.3s ease;
}
.progress-stats {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #a0a8c0;
}
.progress-stats span b {
    color: #fff;
}

.scanner-card {
    background: #14192e;
    border-radius: 12px;
    margin: 16px;
    padding: 16px;
    color: #fff;
}
.scanner-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.scanner-frame video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}
#scannerPlaceholder {
    color: #666;
    text-align: center;
    padding: 20px;
}
#scannerPlaceholder .icon {
    font-size: 48px;
    display: block;
    margin-bottom: 8px;
}
#scannerFrame {
    position: absolute;
    top: 10%;
    left: 10%;
    right: 10%;
    bottom: 10%;
    border: 3px solid #d4af37;
    border-radius: 12px;
    display: none;
    pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
}
.scanner-buttons {
    display: flex;
    gap: 10px;
}
.scanner-buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}
.btn-start {
    background: #d4af37;
    color: #0a0e1a;
}
.btn-start:disabled {
    background: #555;
    color: #888;
    cursor: not-allowed;
}
.btn-stop {
    background: #dc3545;
    color: #fff;
}
.btn-stop:disabled {
    background: #444;
    color: #777;
    cursor: not-allowed;
}

.scan-result {
    display: none;
    background: rgba(34, 197, 94, 0.2);
    border: 1px solid #22c55e;
    border-radius: 8px;
    padding: 12px;
    margin: 0 16px 16px;
    color: #22c55e;
    font-weight: 600;
    text-align: center;
}

.checkpoints-card,
.manual-card {
    background: #14192e;
    border-radius: 12px;
    margin: 16px;
    padding: 16px;
    color: #fff;
}
.checkpoints-card h2,
.manual-card h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: #d4af37;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.checkpoint-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.checkpoint-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: #1e2442;
    border-radius: 8px;
    border-left: 3px solid #555;
}
.checkpoint-item.completed {
    border-left-color: #22c55e;
    background: rgba(34, 197, 94, 0.1);
}
.checkpoint-icon {
    font-size: 20px;
    color: #666;
    width: 24px;
    text-align: center;
}
.checkpoint-item.completed .checkpoint-icon {
    color: #22c55e;
}
.checkpoint-name {
    font-weight: 600;
    font-size: 14px;
}
.checkpoint-order {
    font-size: 12px;
    color: #a0a8c0;
}

.manual-card select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2a3155;
    background: #1e2442;
    color: #fff;
    font-size: 14px;
    margin-bottom: 10px;
}
.btn-manual {
    width: 100%;
    padding: 12px;
    background: #d4af37;
    color: #0a0e1a;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
}

#loadingOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    color: #d4af37;
    font-size: 16px;
}
#loadingOverlay.show {
    display: flex;
}
</style>
</head>
<body>

<header class="patrol-header">
    <button class="patrol-back" onclick="history.back()">←</button>
    <h1>🛡️ Patrol Scan</h1>
</header>

<!-- SHIFT BANNER -->
<div id="rbDutyBanner" style="display:none;"></div>

<!-- Progress -->
<div class="progress-card">
    <div class="progress-header">
        <div>
            <div style="font-size:13px;color:#a0a8c0;">Today's Progress</div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>
    <div class="progress-stats">
        <span>Scanned: <b id="scannedCount">0</b></span>
        <span>Total: <b id="totalCount">0</b></span>
        <span>Remaining: <b id="remainingCount">0</b></span>
    </div>
</div>

<!-- Scanner -->
<div class="scanner-card">
    <div class="scanner-frame">
        <div id="scannerPlaceholder">
            <span class="icon">📷</span>
            <div>Tap "Start Scanner" below</div>
        </div>
        <video id="qrVideo" playsinline autoplay muted></video>
        <div id="scannerFrame"></div>
    </div>
    <div class="scanner-buttons">
        <button class="btn-start" id="startScanBtn" onclick="startScanner()">▶ Start Scanner</button>
        <button class="btn-stop" id="stopScanBtn" onclick="stopScanner()" disabled>■ Stop</button>
    </div>
</div>

<!-- Scan result -->
<div class="scan-result" id="scanResult">
    <div id="scanSuccessText">—</div>
</div>

<!-- Checkpoints list -->
<div class="checkpoints-card">
    <h2>Checkpoints</h2>
    <div id="checkpointsList">
        <div class="empty-state" style="padding: 20px;">
            <p>Loading...</p>
        </div>
    </div>
</div>

<!-- Manual select -->
<div class="manual-card">
    <h2>Manual Log</h2>
    <select id="manualCheckpoint">
        <option value="">-- Select Checkpoint --</option>
    </select>
    <button class="btn-manual" onclick="submitManualScan()">Log Checkpoint</button>
</div>

<!-- Loading overlay -->
<div id="loadingOverlay">
    <div id="loadingText">Loading...</div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/offline.js"></script>
<script src="js/app.js"></script>
<script src="js/permissions.js"></script>
<script src="js/shift-common.js"></script>
<script src="js/jsqr.min.js"></script>
<script src="js/patrol.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof RBShift !== 'undefined') {
        RBShift.injectBanner();
    }
});
</script>

</body>
</html>
