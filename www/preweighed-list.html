<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Pre-Weighed Trucks - Reeves Belt App</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">

    <div class="network-bar" id="networkBar"></div>

    <div class="form-container">

        <div class="form-header">
            <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
            <div class="form-header-title">🚛 Pre-Weighed Trucks</div>
        </div>

        <div class="form-card">
            <div class="form-card-title">Filters</div>
            <div class="field-row">
                <div class="field">
                    <label class="field-label">Date</label>
                    <input type="date" id="pwFilterDate" class="field-input">
                </div>
                <div class="field">
                    <label class="field-label">Status</label>
                    <select id="pwFilterStatus" class="field-input">
                        <option value="" selected>Active (Yard)</option>
                        <option value="parked">Parked</option>
                        <option value="sampled">Sampled</option>
                        <option value="called_in">Called / Not at Yard</option>
                        <option value="weighed">Weighed (Inside)</option>
                        <option value="departed">Departed</option>
                        <option value="cancelled">Cancelled</option>
                        <option value="__all__">Show All</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label class="field-label">Plate (partial)</label>
                <input type="text" id="pwFilterPlate" class="field-input" placeholder="e.g. KDV" style="text-transform:uppercase;">
            </div>
            <button type="button" onclick="RBPreweighed.applyFilters()" class="action-btn blue" style="width:100%; margin-top:10px;">Apply Filters</button>
        </div>

        <div style="margin: 0 0 14px;">
            <a href="preweighed-add.html" id="pwAddBtn" class="action-btn green" style="display:block; text-align:center; text-decoration:none; padding:16px; border-radius:14px;">➕ Add Truck</a>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:14px;">
            <a href="preweighed-reveal.html" class="action-btn blue" style="flex:1; text-align:center; text-decoration:none;">🔍 Reveal Code</a>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div class="app-section-title" style="padding-left:5px; margin:0;">Trucks in Yard</div>
            <div id="pwActiveBadge" style="font-size:10px; color:#10b981; font-weight:700; letter-spacing:1px;">● ACTIVE</div>
        </div>
        <div id="pwList">
            <div class="empty-state"><p>Loading...</p></div>
        </div>

    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Loading...</div>
    </div>

    <script src="js/vault.js"></script>
    <script src="js/biometric.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/app.js"></script>
    <script src="js/preweighed.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var dateEl = document.getElementById('pwFilterDate');
            if (dateEl) {
                var now = new Date();
                dateEl.value = now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0');
            }

            var statusEl = document.getElementById('pwFilterStatus');
            if (statusEl) {
                statusEl.addEventListener('change', function () {
                    RBPreweighed.applyFilters();
                });
            }

            RBPreweighed.initListPage();
        });
    </script>
</body>
</html>
