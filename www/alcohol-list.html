<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>AlcoBlow Tests - Reeves Belt App</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">

<div class="network-bar" id="networkBar"></div>

<div class="form-container">

    <div class="form-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="form-header-title">🍷 AlcoBlow Tests</div>
    </div>

    <div style="margin: 0 0 14px;">
        <a href="alcohol-test-form.html" class="action-btn green" style="display:block; text-align:center; text-decoration:none; padding:16px; border-radius:14px;">➕ New Test</a>
    </div>

    <div class="form-card">
        <div class="form-card-title">Filters</div>
        <div class="field-row">
            <div class="field">
                <label class="field-label">Date</label>
                <input type="date" id="alFilterDate" class="field-input">
            </div>
            <div class="field">
                <label class="field-label">Result</label>
                <select id="alFilterResult" class="field-input">
                    <option value="">All</option>
                    <option value="pass">PASS</option>
                    <option value="warn">WARN</option>
                    <option value="fail">FAIL</option>
                </select>
            </div>
        </div>
        <div class="field">
            <label class="field-label">Search (name / ID / plate)</label>
            <input type="text" id="alFilterSearch" class="field-input" placeholder="Type to search...">
        </div>
        <button type="button" onclick="RBAlcohol.loadTestList()" class="action-btn blue" style="width:100%; margin-top:10px;">Apply Filters</button>
    </div>

    <div class="stats-grid" style="padding: 0 15px; margin-bottom: 14px;">
        <div class="stat-box">
            <div class="stat-value" id="alTotal">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-box green">
            <div class="stat-value" id="alPass">0</div>
            <div class="stat-label">Pass</div>
        </div>
        <div class="stat-box" style="border-bottom-color: #f59e0b;">
            <div class="stat-value" id="alWarn">0</div>
            <div class="stat-label">Warn</div>
        </div>
        <div class="stat-box" style="border-bottom-color: #ef4444;">
            <div class="stat-value" id="alFail">0</div>
            <div class="stat-label">Fail</div>
        </div>
    </div>

    <div class="app-section-title" style="padding-left:5px; margin-bottom:12px;">Tests</div>
    <div id="alList">
        <div class="empty-state"><p>Loading...</p></div>
    </div>

</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Loading...</div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/offline.js"></script>
<script src="js/app.js"></script>
<script src="js/alcohol.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        RBAlcohol.initTestList();
    });
</script>

</body>
</html>
